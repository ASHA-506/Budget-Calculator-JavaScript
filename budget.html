<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendCraft Budget Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
     rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWL
     zeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="budget.css">
</head>
<body>
        <label style="margin: 5px;" for="date">Date & Time</label>
        <input style="height: 20px;width: 170px;"id="date" type="text" readonly>

    <div class="form-container">
<div >   <h1>SpendCraft Budget Calculator</h1> 
     <h3 style="color: black;margin-bottom: 38px; font-style: italic; align-items: center ">.....For Better Tomorrow.....</h3>

</div>

<div class="div1" style="align-items: center;">
    <div class="part1">
                <div>
            <label style="color:darkgreen;" for="income">Total Income(₹):</label><br>
            <input type="number" id="income" name="income"  required>
        </div>
        
        <div>
            <label for="grocery">Groceries(₹):</label><br>
            <input type="number" id="grocery" name="grocery"  required>
        </div>
                <div>
            <label for="transp">Transportation(₹):</label><br>
            <input type="number" id="transp" name="transp"  required>
        </div>
                <div>
            <label for="entert">Entertainment(₹):</label><br>
            <input type="number" id="entert" name="entert"  required>
        </div>

    </div>
       
        <div class="part2">
            <div>
            <label for="expense">Other Expenses(₹):</label><br>
            <input type="number" id="expense" name="expense"  required>
        </div>
                <div>
            <label for="rent">Rent(₹):</label><br>
            <input type="number" id="rent" name="rent"  required>
        </div>
                        <div>
            <label style="color: green;" for="saved">"You have saved"(₹):</label><br>
            <input type="text" id="saved" name="saved" readonly>
        </div>
                        <div>
            <label style="color: orangered;" for="spent">"You have overspent by"(₹):</label><br>
            <input type="text" id="spent" name="spent" readonly >
        </div>



        </div>

        
</div>

<button type="button" onclick ="calculate()" >Calculate</button>



            </div>
<a href="#"  type="button" onclick="logout()"><img src="10313098.png" alt="Logout">
</a>
    </div>
<script src="budget.js"></script>
</body>
</html>
